# Code validation before the plugin reaches main. This mirrors the steps of the
# GitHub workflow, but over a SINGLE combination: the ten-way matrix stays in
# GitHub Actions, which is free on public repositories, while Bitbucket
# Pipelines is billed per build minute.
image: moodlehq/moodle-php-apache:8.3

definitions:
  services:
    mariadb:
      image: mariadb:11
      memory: 1024
      variables:
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
        MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'

  steps:
    - step: &moodle-plugin-ci
        name: Moodle Plugin CI
        # 1x keeps the minute cost down. If PHPUnit is ever killed for lack of
        # memory, this is the knob: 2x doubles the RAM and the minutes spent.
        services:
          - mariadb
        caches:
          - composer
        script:
          - export DB=mariadb
          - export MOODLE_BRANCH=MOODLE_503_STABLE
          - export NVM_DIR="$HOME/.nvm"
          # The build runs as root, and Composer disables its plugins for root
          # unless told otherwise: phpcodesniffer-composer-installer is one of them.
          - export COMPOSER_ALLOW_SUPERUSER=1
          - git config --global --add safe.directory '*'
          - locale-gen en_AU.UTF-8 || true
          # The mustache lint validates the HTML with the W3C validator, a .jar:
          # GitHub runners ship Java, this image does not.
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless
          # Grunt needs Node, and moodle-plugin-ci installs the version Moodle
          # asks for through nvm. The image does not ship it.
          - if [ ! -s "$NVM_DIR/nvm.sh" ]; then curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash; fi
          # Node has to exist before composer create-project: its post-install
          # script runs npm install. lts/jod is what Moodle 5.1 asks in .nvmrc.
          - . "$NVM_DIR/nvm.sh"
          - nvm install lts/jod
          # The clone IS the working directory, but moodle-plugin-ci installs
          # Moodle as a sibling of the plugin, so the plugin is moved aside.
          - mkdir -p /opt/ci-workspace
          - cp -a "$BITBUCKET_CLONE_DIR" /opt/ci-workspace/plugin
          - cd /opt/ci-workspace
          # The image ships PHP but not Composer, and moodle-plugin-ci is installed
          # with it. Skipped when a future image does bring one.
          - if ! command -v composer >/dev/null 2>&1; then curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer; fi
          - composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          - export PATH="/opt/ci-workspace/ci/bin:/opt/ci-workspace/ci/vendor/bin:$PATH"
          # CourseTransfer Manager builds on CourseTransfer: its dependency has
          # to be in the tree or the plugin will not even install. Pinned to the
          # 2.2.0 release branch until UNIMOODLE tags v2.2.0; then pin the tag again.
          - moodle-plugin-ci add-plugin --branch release/2.2.0 UNIMOODLE/moodle-local_coursetransfer
          - moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          - moodle-plugin-ci phplint
          - moodle-plugin-ci phpcs --max-warnings 0
          - moodle-plugin-ci phpdoc --max-warnings 0
          - moodle-plugin-ci validate
          - moodle-plugin-ci savepoints
          - moodle-plugin-ci mustache
          - moodle-plugin-ci grunt --max-lint-warnings 0
          - moodle-plugin-ci phpunit --fail-on-warning

pipelines:
  # Only on pull requests: the cost then follows deliveries, two per release,
  # instead of following how often develop is pushed to.
  pull-requests:
    '**':
      - step: *moodle-plugin-ci

  custom:
    manual:
      - step: *moodle-plugin-ci
